name=Playful Light
parent=FlatLight

# Rounded corners
Component.arc=12
Button.arc=999
TextComponent.arc=10
ProgressBar.arc=10

# Font
Component.font=Comic Sans MS-PLAIN-14

# Base colors
Component.background=#fdf6e3
Component.foreground=#333333

# Button
Button.background=#f08080
Button.foreground=#202020
Button.hoverBackground=#ffb3b0
Button.pressedBackground=#ff9996
Button.focusedBorderColor=#ff8a80

# Text Fields
TextComponent.background=#fff8dc
TextComponent.foreground=#333333
TextComponent.selectionBackground=#b2ebf2
TextComponent.selectionForeground=#000000
TextComponent.caretColor=#ff4081
TextComponent.borderColor=#ffb6c1

# ScrollBar
ScrollBar.thumb=#ffc1e3
ScrollBar.thumbHover=#ffa4c9
ScrollBar.track=#fbeff2

# TabbedPane
TabbedPane.selectedBackground=#ffe4e1
TabbedPane.background=#fff5f5
TabbedPane.foreground=#444444
TabbedPane.underlineColor=#ff80ab

# ToolTip
ToolTip.background=#fff0f5
ToolTip.foreground=#000000

# Highlight
Component.focusWidth=2
Component.focusColor=#ff80ab
Component.innerFocusWidth=0

# Border
Component.borderWidth = 1
Component.borderColor = #000000