name: Build and Release self-contained, executable jar files
run-name: ${{ github.actor }} is building release jars

on:
  release:
    types: [published]  # Trigger only when a release is published

jobs:
  build-and-release:
    name: Build and Release code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build project with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload client JAR as release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: client/build/libs/client.jar
          asset_name: skribbl-io-java-client-21.jar
          asset_content_type: application/java-archive

      - name: Upload server JAR as release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: server/build/libs/server.jar
          asset_name: skribbl-io-java-server-21.jar
          asset_content_type: application/java-archive